<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchTrack - Your Architecture Journey</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo-container">
                <div class="logo-icon">🏛️</div>
                <h1 class="logo-text">ArchTrack</h1>
            </div>
            
            <div id="dynamic-nav-sections">
                <!-- Navigation sections will be injected dynamically -->
            </div>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar"></div>
                    <div class="user-info">
                        <p class="user-name">Maris</p>
                        <p class="user-role">CCNY Pre-Architecture</p>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="greeting">
                    <h2 id="page-title">Dashboard Overview</h2>
                    <p id="page-subtitle" class="text-muted">Welcome to your architecture journey.</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="global-add-btn">+ Log Hours</button>
                    <div class="theme-toggle" id="theme-toggle">🌙</div>
                </div>
            </header>

            <div id="view-container" class="view-container">
                <!-- Content will be injected here dynamically -->
            </div>
        </main>
    </div>

    <!-- Onboarding Flow Overlay -->
    <div id="onboarding-container" class="onboarding-overlay"></div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
